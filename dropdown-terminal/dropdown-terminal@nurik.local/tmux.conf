# tmux of the drop-down terminal (server -L dropdown, apart from your own tmux).
# The mouse wheel scrolls the output. What you select with the mouse goes to the
# clipboard on release; dragging past the top or bottom edge scrolls on.
set -g mouse on
set -sF copy-command "gjs -m '#{d:current_file}/copy.js'"
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g focus-events on
# A thin status line: the tmux windows act as tabs (Ctrl+B C new, Ctrl+B N next).
set -g status-position bottom
set -g status-style "bg=#181825,fg=#a6adc8"
set -g window-status-current-style "fg=#cba6f7,bold"
set -g status-left ""
set -g status-right "#S"
