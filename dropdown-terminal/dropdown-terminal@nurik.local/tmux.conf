# tmux of the drop-down terminal (server -L dropdown, apart from your own tmux).
set -g mouse on
# Copy mode keys are the same whatever $EDITOR says.
set -g mode-keys emacs
# What is copied goes to the clipboard through copy.js.
set -sF copy-command "gjs -m '#{d:current_file}/copy.js'"

# Mouse: the wheel scrolls; a selection is copied on release, also over the
# status line, where a drag past the bottom edge ends. Dragging past an edge
# or turning the wheel with the button held scrolls on.
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel \; display -d 1500 "Скопировано"
bind -n MouseDragEnd1Status if -F "#{pane_in_mode}" { send -X copy-pipe-and-cancel ; display -d 1500 "Скопировано" }
bind -n MouseDragEnd1StatusDefault if -F "#{pane_in_mode}" { send -X copy-pipe-and-cancel ; display -d 1500 "Скопировано" }
bind -n MouseDragEnd1StatusLeft if -F "#{pane_in_mode}" { send -X copy-pipe-and-cancel ; display -d 1500 "Скопировано" }
bind -n MouseDragEnd1StatusRight if -F "#{pane_in_mode}" { send -X copy-pipe-and-cancel ; display -d 1500 "Скопировано" }

# Keyboard: Shift+PgUp/PgDn scroll (in a full-screen program they stay its
# own), Shift+arrows select, Enter or Ctrl+Shift+C copies, Esc leaves.
bind -n S-PPage if -F "#{alternate_on}" { send-keys S-PPage } { copy-mode -eu }
bind -T copy-mode S-PPage send -X page-up
bind -T copy-mode S-NPage send -X page-down
bind -T copy-mode S-Up if -F "#{selection_present}" { send -X cursor-up } { send -X begin-selection ; send -X cursor-up }
bind -T copy-mode S-Down if -F "#{selection_present}" { send -X cursor-down } { send -X begin-selection ; send -X cursor-down }
bind -T copy-mode S-Left if -F "#{selection_present}" { send -X cursor-left } { send -X begin-selection ; send -X cursor-left }
bind -T copy-mode S-Right if -F "#{selection_present}" { send -X cursor-right } { send -X begin-selection ; send -X cursor-right }
bind -T copy-mode Enter send -X copy-pipe-and-cancel \; display -d 1500 "Скопировано"

set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g focus-events on
# A thin status line: the tmux windows act as tabs (Ctrl+B C new, Ctrl+B N next).
set -g status-position bottom
set -g status-style "bg=#181825,fg=#a6adc8"
set -g window-status-current-style "fg=#cba6f7,bold"
set -g status-left ""
set -g status-right "#S"
