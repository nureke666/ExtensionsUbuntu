# tmux of the drop-down terminal (server -L dropdown, apart from your own tmux).
# The mouse wheel scrolls the output; select with Shift held to copy to the
# clipboard (Ctrl+Shift+C) as in any terminal.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g focus-events on
# A thin status line: the tmux windows act as tabs (Ctrl+B C new, Ctrl+B N next).
set -g status-position bottom
set -g status-style "bg=#181825,fg=#a6adc8"
set -g window-status-current-style "fg=#cba6f7,bold"
set -g status-left ""
set -g status-right "#S"
